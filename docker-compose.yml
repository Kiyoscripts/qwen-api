services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qwen38
      POSTGRES_USER: qwen38
      POSTGRES_PASSWORD: qwen38
    ports:
      - "5432:5432"
    volumes:
      - qwen38_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwen38 -d qwen38"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  qwen38_postgres:
